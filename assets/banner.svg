<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="AI Factory — Cognitive Architecture Deployment Engine">
  <defs>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5EE2FF">
        <animate attributeName="stop-color"
                 values="#5EE2FF;#4F8CFF;#8B5CF6;#D946EF;#5EE2FF"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#8B5CF6">
        <animate attributeName="stop-color"
                 values="#8B5CF6;#D946EF;#5EE2FF;#4F8CFF;#8B5CF6"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D946EF">
        <animate attributeName="stop-color"
                 values="#D946EF;#5EE2FF;#4F8CFF;#8B5CF6;#D946EF"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5EE2FF"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5EE2FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8B5CF6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#5EE2FF"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <symbol id="gearShape" viewBox="-100 -100 200 200">
      <!-- 8-tooth gear, drawn so it rotates around (0,0) -->
      <path fill="url(#gear)" d="
        M -14 -86 L 14 -86 L 20 -64
        A 66 66 0 0 1 42 -52 L 64 -64 L 86 -42 L 74 -20
        A 66 66 0 0 1 86 14 L 86 14 L 86 14
        L 86 -14 L 64 -20 A 66 66 0 0 1 52 -42 L 64 -64
        Z" opacity="0"/>
      <!-- Outer toothed wheel via 8 rotated trapezoid teeth + main disc -->
      <g>
        <g>
          <rect x="-12" y="-92" width="24" height="22" rx="3" fill="url(#gear)"/>
          <rect x="-12" y="-92" width="24" height="22" rx="3" fill="url(#gear)" transform="rotate(45)"/>
          <rect x="-12" y="-92" width="24" height="22" rx="3" fill="url(#gear)" transform="rotate(90)"/>
          <rect x="-12" y="-92" width="24" height="22" rx="3" fill="url(#gear)" transform="rotate(135)"/>
          <rect x="-12" y="-92" width="24" height="22" rx="3" fill="url(#gear)" transform="rotate(180)"/>
          <rect x="-12" y="-92" width="24" height="22" rx="3" fill="url(#gear)" transform="rotate(225)"/>
          <rect x="-12" y="-92" width="24" height="22" rx="3" fill="url(#gear)" transform="rotate(270)"/>
          <rect x="-12" y="-92" width="24" height="22" rx="3" fill="url(#gear)" transform="rotate(315)"/>
        </g>
        <circle cx="0" cy="0" r="70" fill="url(#gear)"/>
        <circle cx="0" cy="0" r="28" fill="#0B0F17"/>
      </g>
    </symbol>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F17"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>

  <!-- Gear icon on the left, rotating -->
  <g transform="translate(160 180)" filter="url(#softGlow)">
    <g>
      <use href="#gearShape" width="200" height="200" x="-100" y="-100"/>
      <animateTransform attributeName="transform"
                       attributeType="XML"
                       type="rotate"
                       from="0"
                       to="360"
                       dur="18s"
                       repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Main title -->
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="720" y="200"
          text-anchor="middle"
          font-weight="900"
          font-size="140"
          letter-spacing="-5"
          fill="url(#title)">AI FACTORY</text>
  </g>

  <!-- Separator -->
  <g transform="translate(720 242)">
    <circle cx="-260" cy="0" r="3" fill="url(#dot)"/>
    <rect   x="-242" y="-1" width="484" height="2" fill="url(#rule)"/>
    <circle cx="260"  cy="0" r="3" fill="url(#dot)"/>
  </g>

  <!-- Subtitle -->
  <text x="720" y="278"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="14"
        letter-spacing="5"
        fill="#9CB0CE">COGNITIVE ARCHITECTURE DEPLOYMENT ENGINE</text>

  <text x="720" y="308"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="13"
        letter-spacing="3"
        fill="#5EE2FF">v1.3.0-core</text>
</svg>
