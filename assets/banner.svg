<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="AI Factory — Cognitive Architecture Deployment Engine">
  <defs>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5EE2FF"/>
      <stop offset="35%"  stop-color="#4F8CFF"/>
      <stop offset="70%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5EE2FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8B5CF6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#5EE2FF"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F17"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="180"
          text-anchor="middle"
          font-weight="900"
          font-size="150"
          letter-spacing="-6"
          fill="url(#title)">AI FACTORY</text>
  </g>

  <g transform="translate(600 232)">
    <circle cx="-280" cy="0" r="3" fill="url(#dot)"/>
    <rect   x="-260" y="-1" width="520" height="2" fill="url(#rule)"/>
    <circle cx="280"  cy="0" r="3" fill="url(#dot)"/>
  </g>

  <text x="600" y="270"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="15"
        letter-spacing="5"
        fill="#9CB0CE">COGNITIVE ARCHITECTURE DEPLOYMENT ENGINE</text>

  <text x="600" y="305"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="13"
        letter-spacing="3"
        fill="#5EE2FF">v1.2.0-core</text>
</svg>
